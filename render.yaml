# Render Blueprint. Render → New → Blueprint → pick this repository.
# (Or create a Static Site by hand with the same build command and publish directory.)
services:
  - type: web
    name: meri-yojana-karnal
    runtime: static
    buildCommand: node test/check.js
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Only the site's own files may run or load; nothing is fetched from anywhere else
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; object-src 'none'"
      # Fonts never change under this name
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Pages and the service worker are always re-checked, so data updates reach people straight away
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /app.js
        name: Cache-Control
        value: no-cache
      - path: /engine.js
        name: Cache-Control
        value: no-cache
      - path: /style.css
        name: Cache-Control
        value: no-cache
      - path: /data.json
        name: Cache-Control
        value: no-cache
