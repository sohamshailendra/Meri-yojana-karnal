<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meri Yojana – Karnal | मेरी योजना – करनाल</title>
<meta name="description" content="Find the Central and Haryana Government schemes you can apply for in District Karnal. Answer up to 8 simple questions, in Hindi or English. | करनाल में आपके लिए कौन-सी सरकारी योजनाएँ हैं, जानिए।">
<meta name="theme-color" content="#1F2F5C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2F5C;        /* district navy, from the master's header row */
  --ink-soft:#4A5680;
  --paddy:#2E6B3F;      /* eligible */
  --paddy-tint:#E6F0E8;
  --haldi:#9A6A05;      /* check */
  --haldi-tint:#FBF1D9;
  --stamp:#6B3FA0;      /* rubber-stamp violet for the verification badge */
  --paper:#F5F6F2;
  --card:#FFFFFF;
  --line:#D8DCD2;
  --text:#1B2130;
  --muted:#5B6272;
  --focus:#1F6FEB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#AFC0F2;--ink-soft:#8E9BC7;--paddy:#7CC48E;--paddy-tint:#1C3024;--haldi:#E9B949;--haldi-tint:#352A10;
    --stamp:#C3A2EE;--paper:#12151C;--card:#1B1F29;--line:#2E3442;--text:#E8EAF0;--muted:#A4AABA;--focus:#7AA7FF;
  }
}
:root[data-theme="dark"]{
  --ink:#AFC0F2;--ink-soft:#8E9BC7;--paddy:#7CC48E;--paddy-tint:#1C3024;--haldi:#E9B949;--haldi-tint:#352A10;
  --stamp:#C3A2EE;--paper:#12151C;--card:#1B1F29;--line:#2E3442;--text:#E8EAF0;--muted:#A4AABA;--focus:#7AA7FF;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--text);
  font-family:"Mukta","Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{font-weight:800;font-size:19px;color:var(--ink);line-height:1.15}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 14px;min-height:40px;cursor:pointer;font-weight:700;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
main{padding:22px 0 140px}
.ticks{display:flex;gap:6px;margin:4px 0 18px}
.ticks span{flex:1;height:8px;border-radius:2px;background:var(--line)}
.ticks span.done{background:var(--ink)}
.ticks span.now{background:var(--ink-soft)}
.qcount{font-size:15px;color:var(--muted);margin:0}
h1.q{font-size:30px;line-height:1.2;font-weight:800;color:var(--ink);margin:6px 0 6px}
.hint{color:var(--muted);margin:0 0 18px;font-size:16px}
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);
  border-radius:12px;padding:14px 16px;min-height:60px;cursor:pointer}
.opt .box{flex:none;width:26px;height:26px;border:2px solid var(--ink-soft);border-radius:6px;display:grid;place-items:center}
.opt.single .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--paddy-tint)}
.opt[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.opt[aria-pressed="true"] .box::after{content:"";width:8px;height:14px;border:solid var(--paper);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.opt.single[aria-pressed="true"] .box::after{width:10px;height:10px;border:0;border-radius:50%;background:var(--paper);transform:none}
.opt .t{font-weight:700;font-size:19px;line-height:1.25}
.opt .s{display:block;font-weight:400;font-size:15px;color:var(--muted)}
.opts.grid .opt{justify-content:center;padding:12px 8px;min-height:56px;text-align:center}
.opts.grid .opt .box{display:none}
.group-h{font-size:16px;font-weight:700;color:var(--ink-soft);margin:18px 0 8px}
.field{margin:18px 0}
.field label{display:block;font-weight:700;margin-bottom:8px}
.age{display:flex;align-items:center;gap:10px}
.age input{width:120px;font-size:26px;font-weight:700;text-align:center;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.age button{width:56px;height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:26px;font-weight:700;cursor:pointer}
.err{color:#B3261E;font-weight:700;margin:10px 0 0;min-height:1.5em}
@media (prefers-color-scheme:dark){.err{color:#FFB4AB}}
nav.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.actions .wrap{display:flex;gap:10px;padding-top:12px;padding-bottom:12px}
.btn{border:2px solid var(--ink);border-radius:12px;min-height:56px;padding:10px 18px;font-weight:800;font-size:19px;cursor:pointer;background:transparent;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--ink);color:var(--paper);flex:1}
.hero{padding:10px 0 0}
.hero h1{font-size:46px;line-height:1.05;font-weight:800;color:var(--ink);margin:0 0 4px}
.hero h1 .sub{display:block;font-size:22px;font-weight:700;color:var(--ink-soft);margin-top:10px;line-height:1.25}
.hero p{font-size:19px;max-width:32em}
.facts{list-style:none;padding:0;margin:22px 0;display:grid;gap:10px}
.facts li{border-left:4px solid var(--paddy);padding:4px 0 4px 12px}
.meta{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 12px}
.sum a{display:block;text-decoration:none;border-radius:12px;padding:12px 14px;color:var(--text);font-size:16px;line-height:1.3}
.sum .e{background:var(--paddy-tint);border:2px solid var(--paddy)}
.sum .c{background:var(--haldi-tint);border:2px solid var(--haldi)}
.sum b{display:block;font-size:40px;line-height:1;font-weight:800;margin-bottom:4px}
.sum .e b{color:var(--paddy)} .sum .c b{color:var(--haldi)}
h2.sec{font-size:24px;font-weight:800;color:var(--ink);margin:30px 0 4px}
.secnote{color:var(--muted);font-size:16px;margin:0 0 10px}
h3.sector{font-size:17px;font-weight:700;color:var(--muted);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--paddy);border-radius:10px;padding:14px 16px;margin:0 0 12px;position:relative}
.card.check{border-left-color:var(--haldi)}
.card.life{border-left-color:var(--ink-soft)}
.card h4{margin:0;font-size:20px;line-height:1.25;font-weight:800;padding-right:92px}
.card .alt{margin:2px 0 0;color:var(--muted);font-size:15px;padding-right:92px}
.card .ben{margin:10px 0 6px;font-size:17px}
.stamp{position:absolute;top:12px;right:10px;width:82px;text-align:center;font-size:11px;line-height:1.15;font-weight:800;
  color:var(--stamp);border:2px solid var(--stamp);outline:1px solid var(--stamp);outline-offset:2px;border-radius:6px;padding:4px 3px;transform:rotate(-4deg)}
.stamp.pending{color:var(--muted);border-color:var(--muted);border-style:dashed;outline:0;transform:none}
.why{background:var(--haldi-tint);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:15px}
.why p{margin:4px 0}
.window{display:inline-block;background:var(--ink);color:var(--paper);font-weight:700;border-radius:6px;padding:4px 10px;margin:6px 0;font-size:16px}
.contact{font-size:15px;margin:6px 0}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;color:var(--ink);min-height:44px;display:flex;align-items:center}
.det{font-size:15px}
.det h5{margin:12px 0 2px;font-size:15px;color:var(--ink-soft)}
.det p{margin:2px 0;white-space:pre-line}
.det ul{margin:4px 0;padding-left:20px}
.det a{color:var(--ink);word-break:break-all}
.slabs{margin:8px 0;padding:0;list-style:none;font-size:15px}
.slabs li{padding:3px 0;color:var(--muted)}
.slabs li.m{color:var(--text);font-weight:700}
.slabs li.m::before{content:"✓ ";color:var(--paddy)}
.docs{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:12px 0}
.docs ul{list-style:none;padding:0;margin:6px 0;columns:2;column-gap:16px}
.docs li{break-inside:avoid;padding:4px 0 4px 28px;position:relative;font-size:16px}
.docs li::before{content:"";position:absolute;left:0;top:8px;width:18px;height:18px;border:2px solid var(--ink-soft);border-radius:4px}
.rbar{display:flex;flex-wrap:wrap;gap:8px}
.rbar .btn{flex:1 1 180px;font-size:17px;min-height:52px}
.lifebox{margin-top:30px}
.lifebox>summary{font-size:22px;font-weight:800}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:16px}
.foot{margin-top:34px;font-size:14px;color:var(--muted)}
@media (max-width:380px){.hero h1{font-size:38px}h1.q{font-size:26px}.docs ul{columns:1}}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media print{
  header.top,nav.actions,.rbar,.noprint,.lifebox{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  main{padding:0}
  .card{break-inside:avoid;border-color:#999}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand" id="brand"></div>
  <div class="lang" role="group" aria-label="Language / भाषा">
    <button type="button" id="l-hi" aria-pressed="true">हिं</button>
    <button type="button" id="l-en" aria-pressed="false">EN</button>
  </div>
</div></header>
<main><div class="wrap" id="app" aria-live="polite"></div></main>
<nav class="actions"><div class="wrap" id="actbar"></div></nav>

<script>/* Karnal Yojana Finder – matching and question engine.
   Used by the app (browser) and by the test script (node). No network, no storage. */
(function (root) {
  'use strict';

  var LEVELS = ['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10','c11','c12','iti','diploma','ug','pg','phd'];
  var INCOME_BANDS = [            // [low, high) in rupees per year
    { id: 'i1', lo: 0,      hi: 100000 },
    { id: 'i2', lo: 100000, hi: 180000 },
    { id: 'i3', lo: 180000, hi: 250000 },
    { id: 'i4', lo: 250000, hi: 300000 },
    { id: 'i5', lo: 300000, hi: 800000 },
    { id: 'i6', lo: 800000, hi: Infinity }
  ];
  var DIS_BANDS = { none: null, d1: [1, 40], d2: [40, 60], d3: [60, 70], d4: [70, 101] };
  var RES_BANDS = { r0: [0, 1], r1: [1, 3], r2: [3, 5], r3: [5, 15], r4: [15, 200] };
  var SOFT_EVENTS = { admission: 1, retirement: 1 };
  var MAX_SCREENS = 8;
  // Order after "Who is this for?". If the path is long, the last ones are skipped (-> Check).
  var ORDER = ['about', 'category', 'income', 'occupation', 'class', 'disability', 'event', 'residence'];

  function hardEvents(s) { return (s.events || []).filter(function (e) { return !SOFT_EVENTS[e]; }).concat(s.special || []); }
  function inter(a, b) { for (var i = 0; i < a.length; i++) if (b.indexOf(a[i]) >= 0) return true; return false; }

  function catMatch(personCats, schemeTokens) {
    for (var i = 0; i < schemeTokens.length; i++) {
      var t = schemeTokens[i];
      if (personCats.indexOf(t) >= 0) return true;
      if (t === 'BC' && (personCats.indexOf('BC-A') >= 0 || personCats.indexOf('BC-B') >= 0)) return true;
    }
    return false;
  }

  /* Evaluate one scheme against the answers.
     ans: answers object; skipped: {questionId:true} for questions dropped by the screen cap.
     Returns {status: 'eligible'|'check'|'event'|'no', reasons:[{key,text}], window, slabs:[...]} */
  function evaluate(s, ans, skipped) {
    skipped = skipped || {};
    var R = [], no = false, eventPending = false, windowNote = null;
    function chk(key, text) { R.push({ key: key, text: text || '' }); }

    // beneficiary type
    if (ans.types && ans.types.indexOf(s.btype) < 0) no = true;

    // gender
    if (s.gender !== 'Any') {
      if (ans.gender) { if (ans.gender !== s.gender) no = true; }
      else if (skipped.about) chk('notasked_gender');
    }
    // age
    if (s.age_min != null || s.age_max != null) {
      if (ans.age != null) {
        if (s.age_min != null && ans.age < s.age_min) no = true;
        if (s.age_max != null && ans.age > s.age_max) no = true;
      } else if (skipped.about || ans.about_done) chk('age_unknown', ageText(s));
    }
    // category
    var c = s.cat || { any: true, tokens: [], other: [] };
    if (!c.any && (c.tokens.length || c.other.length)) {
      if (ans.cats) {
        if (ans.cats.indexOf('UNK') >= 0) chk('cat_unknown', s.cat_raw);
        else if (!catMatch(ans.cats, c.tokens)) {
          if (c.other.length) chk('cat_other', s.cat_raw); else no = true;
        }
      } else if (skipped.category) chk('notasked_cat', s.cat_raw);
    }
    if (c.note) chk('cat_note', c.note);
    // income
    if (s.income_cap != null) {
      if (ans.income === 'UNK') chk('income_unknown', s.income_cap);
      else if (ans.income) {
        var b = INCOME_BANDS.filter(function (x) { return x.id === ans.income; })[0];
        if (b.lo >= s.income_cap) no = true;
        else if (b.hi > s.income_cap) chk('income_border', s.income_cap);
      } else if (skipped.income) chk('notasked_income', s.income_cap);
    }
    // occupation
    if (s.occ && s.occ.length) {
      if (ans.occ) { if (!inter(ans.occ, s.occ)) no = true; }
      else if (skipped.occupation) chk('notasked_occ', s.occ_raw);
    }
    // class / course – only for Student schemes
    if (s.btype === 'Student' && s.cls && s.cls.length && s.cls.length < LEVELS.length) {
      if (ans.cls) { if (s.cls.indexOf(ans.cls) < 0) no = true; }
      else if (skipped['class']) chk('notasked_class', s.cls_raw);
    }
    // disability
    if (s.dis_min != null) {
      if (ans.dis === 'UNK') chk('dis_unknown', s.dis_min);
      else if (ans.dis === 'none') no = true;
      else if (ans.dis) {
        var d = DIS_BANDS[ans.dis];
        if (d[1] <= s.dis_min) no = true;
        else if (d[0] < s.dis_min) chk('dis_border', s.dis_min);
      } else if (skipped.disability) chk('notasked_dis', s.dis_min);
    }
    // residence
    if (s.res_years != null) {
      if (ans.res) {
        var r = RES_BANDS[ans.res];
        if (r[1] <= s.res_years) no = true;
        else if (r[0] < s.res_years) chk('res_border', s.res_years);
      } else chk('res_unknown', s.res_years);
    }
    // life events
    var he = hardEvents(s);
    if (he.length) {
      if (ans.events && inter(ans.events, he)) {
        if (s.window_days && ans.events.some(function (x) { return (s.events || []).indexOf(x) >= 0; })) windowNote = s.window_raw;
      } else eventPending = true;
    }
    // exclusions the app cannot test
    if (s.exclusions) chk('exclusion', s.exclusions);
    // rules present only in the eligibility text
    (s.gaps || []).forEach(function (g) {
      if (g.report_only) return;
      if (g.key === 'category') {
        if (ans.cats && ans.cats.indexOf('UNK') < 0 && inter(ans.cats.concat(expandBC(ans.cats)), g.hint || [])) return;
        chk('gap', g.text); return;
      }
      if (g.key === 'disability') { if (ans.dis && ans.dis !== 'none' && ans.dis !== 'UNK') return; chk('gap', g.text); return; }
      chk('gap', g.text);
    });

    var status = no ? 'no' : eventPending ? 'event' : R.length ? 'check' : 'eligible';
    return { status: status, reasons: dedupe(R), window: windowNote, slabs: matchSlabs(s, ans) };
  }

  function expandBC(cats) { return (cats.indexOf('BC-A') >= 0 || cats.indexOf('BC-B') >= 0) ? ['BC'] : []; }
  function dedupe(R) {
    var seen = {}; return R.filter(function (r) { var k = r.key + '|' + r.text; if (seen[k]) return false; seen[k] = 1; return true; });
  }
  function ageText(s) {
    if (s.age_min != null && s.age_max != null) return s.age_min + '–' + s.age_max;
    if (s.age_min != null) return s.age_min + '+';
    return '≤ ' + s.age_max;
  }
  function matchSlabs(s, ans) {
    if (!s.slabs) return [];
    return s.slabs.map(function (sl) {
      var ok = true;
      if (ans.cls && sl.cls && sl.cls.length && sl.cls.indexOf(ans.cls) < 0) ok = false;
      if (ans.gender && sl.gender && sl.gender !== 'Any' && sl.gender !== ans.gender) ok = false;
      return { id: sl.id, label: sl.label, benefit: sl.benefit, match: ok };
    });
  }

  // ---------------------------------------------------------------- adaptive questions
  function candidates(schemes, ans) {
    return schemes.filter(function (s) { return evaluate(s, ans, {}).status !== 'no'; });
  }
  var RELEVANT = {
    about: function (C) { return C.some(function (s) { return s.gender !== 'Any' || s.age_min != null || s.age_max != null ||
        (s.slabs || []).some(function (x) { return x.gender && x.gender !== 'Any'; }) ||
        (s.gaps || []).some(function (g) { return g.key === 'gender'; }); }); },
    category: function (C) { return C.some(function (s) { return (s.cat && !s.cat.any && (s.cat.tokens.length || s.cat.other.length)) ||
        (s.gaps || []).some(function (g) { return g.key === 'category'; }); }); },
    income: function (C) { return C.some(function (s) { return s.income_cap != null; }); },
    occupation: function (C) { return occOptions(C).length > 0; },
    'class': function (C, ans) { return ans.types && ans.types.indexOf('Student') >= 0 &&
        C.some(function (s) { return s.btype === 'Student' && s.cls && s.cls.length && s.cls.length < LEVELS.length; }); },
    disability: function (C) { return C.some(function (s) { return s.dis_min != null ||
        (s.gaps || []).some(function (g) { return g.key === 'disability'; }); }); },
    event: function (C) { return eventOptions(C).length > 0; },
    residence: function (C) { return C.some(function (s) { return s.res_years != null; }); }
  };
  function occOptions(C) {
    var seen = {}, out = [];
    C.forEach(function (s) { (s.occ || []).forEach(function (o) { if (!seen[o]) { seen[o] = 1; out.push(o); } }); });
    return out;
  }
  function eventOptions(C) {
    var seen = {}, out = [];
    C.forEach(function (s) { hardEvents(s).forEach(function (e) { if (!seen[e]) { seen[e] = 1; out.push(e); } }); });
    return out;
  }
  /* asked: array of question ids already answered (not counting 'types').
     Returns {next: id|null, skipped: {id:true}} */
  function nextQuestion(schemes, ans, asked) {
    var C = candidates(schemes, ans);
    var used = 1 + asked.length; // "types" is screen 1
    var skipped = {};
    for (var i = 0; i < ORDER.length; i++) {
      var q = ORDER[i];
      if (asked.indexOf(q) >= 0) continue;
      if (!RELEVANT[q](C, ans)) continue;
      if (used >= MAX_SCREENS) { skipped[q] = true; continue; }
      return { next: q, skipped: skipped, candidates: C };
    }
    return { next: null, skipped: skipped, candidates: C };
  }
  /* Upper bound on remaining screens, for the progress bar */
  function remainingEstimate(schemes, ans, asked) {
    var C = candidates(schemes, ans), n = 0;
    ORDER.forEach(function (q) { if (asked.indexOf(q) < 0 && RELEVANT[q](C, ans)) n++; });
    return Math.min(n, MAX_SCREENS - 1 - asked.length);
  }

  function results(schemes, ans, skipped) {
    var out = { eligible: [], check: [], event: [] };
    schemes.forEach(function (s) {
      var e = evaluate(s, ans, skipped);
      if (e.status !== 'no') out[e.status].push({ scheme: s, ev: e });
    });

d from ₹2,750 in 2025); indexed to Old Age Samman Allowance increases – DFO to confirm the 2026-27 rate.","benefit_short":"Annual pension to the tree custodian: ₹3,000 (raised from ₹2,750 in 2025); indexed to Old Age Samman Allowance increases – DFO to confirm the 2026-27 rate.","docs_text":"(ID, proof of ownership, tree details, photographs","docs":["(ID, proof of ownership, tree details, photographs"],"docs_canon":["photo"],"how":"Applicant approaches District Forest Office with details; committee verifies age/location/ownership; on approval, pension is credited via DBT; scheme operates statewide to conserve old trees.","mode":"Offline","link_text":"https://haryanaforest.gov.in (default dept portal – confirm)","link":"https://haryanaforest.gov.in","nodal":"Divisional Forest Officer (DFO)","btype_raw":"Individual","btype":"Individual","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":null,"res_years":null,"occ_raw":"Owner/custodian of a 75-year-old tree (non-forest land)","occ":["tree_owner"],"cls_raw":"","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Verified & updated 24-09-2026","verified":true,"gaps":[],"special":[]},{"id":"DIC-003","parent":null,"sector":"Industry / MSME","dept":"Industries & Commerce – DIC Karnal (MSME)","name":"PMEGP scheme","name_hi":"प्रधानमंत्री रोज़गार सृजन कार्यक्रम (PMEGP)","level":"State","elig_text":"Target: Individuals (≥18 years), Self-Help Groups (SHG), Institutions registered under the Societies Registration Act, Production Co-operative Societies and Charitable Trusts. For projects above ₹10 lakh (manufacturing) and above ₹5 lakh (service), minimum educational qualification is Class VIII pass. Existing units or units already availed subsidy under other schemes are ineligible.\nEligibility: i. Any individual, above 18 years of age ii. There will be no income ceiling for assistance for setting up projects under PMEGP. iii. For setting up of project costing above Rs.10 lakh in the Manufacturing sector and above Rs. 5 lakh in the Business /Service sector, the beneficiaries should possess at least VIII standard pass educational qualification. iv. Assistance under the scheme is available only for new projects sanctioned specifically under the PMEGP.v. Existing Units (under PMRY, REGP or any other scheme of Government of\nIndia or State Government) and the units that have already availed\nGovernment Subsidy under any other scheme of Government of India or State Government are not eligible. For up-gradation of existing PMEGPIREGPIMUDRA units:\ni. Margin Money(subsidy)claimed under PMEGP has to be successfully adjusted\non the completion of lock in period of 3 years.\nii. First loan under PMEGP/REGP/MUDRA has to be successfully repaid in\nstipulated time.\niii. The unit is profit making with good turnover and having potential for further\ngrowth in turnover and profit with modernization/upgrading the technology.","benefit":"Subsidy rates on project cost: General category – 15% (urban) / 25% (rural); Special categories (Scheduled Caste/Scheduled Tribe/Other Backward Classes/Minorities/Women/Ex-Servicemen/Persons with Disabilities/ North-Eastern Region/Hill and Border areas) – 25% (urban) / 35% (rural). Beneficiary contribution: 10% (general) / 5% (special categories). Balance via bank term loan.","benefit_short":"Subsidy rates on project cost: General category – 15% (urban) / 25% (rural); Special categories (Scheduled Caste/Scheduled Tribe/Other Backward…","docs_text":"There will be a provision to upload the Photo and documents which are necessary for screening the application, before submitting the application. These documents will include the following: a. Caste Certificate b. Special Category Certificate, wherever required c. Rural Area certificate d. Project Report e. Education! EDP!Skill Development training certificate f. Any other applicable document", g in operations. For others units, existing operations, inventory, machines and sales would form the basis; iii) The enterprise should be unincorporated and should employ less than 10 workers; iv) The enterprise should preferably be involved in the product identified in the ODOP of the district. Other micro enterprises could also be considered; v) The applicant should have ownership right of the enterprise; vi) Ownership status of enterprise could be proprietary / partnership firm; vii) The applicant should be above 18 years of age and should possess at least VIII standard pass educational qualification; viii) Only one person from one family would be eligible for obtaining financial assistance. The “family” for this purpose would include self, spouse and children; ix) Willingness to formalize and contribute10% of project cost and obtain Bank loan; x) Cost of the land should not be included in the Project cost. Cost of the ready built as well as long lease or rental workshed could be included in the project cost. Lease rental of workshed to be included in the project cost should be for a maximum period of 3 years only.","benefit":"Financial assistance (credit-linked grant/subsidy):\n• Individual micro enterprise: 35% of eligible project cost, maximum ₹10,00,000 per unit; minimum 10% beneficiary contribution; balance as bank loan.\n• Common Infrastructure for Groups (FPOs/Cooperatives/SHGs/Government Agencies): 35% of eligible project cost, maximum ₹3,00,00,000.\n• Seed capital for Self-Help Groups: up to ₹40,000 per SHG member for working capital and small tools, subject to applicable caps.\n• Branding & Marketing support as per PMFME guidelines; capacity building and training support.","benefit_short":"Financial assistance (credit-linked grant/subsidy):","docs_text":"There will be a provision to upload the Photo and documents which are necessary for screening the application, before submitting the application. These documents will include the following: a. Project R el Special Task Force; approvals issued by Department; utilities provided by PHED/DHBVN/UHBVN.","mode":"Institutional / Convergence","link_text":"https://haryanarural.gov.in (default dept portal – confirm)","link":"https://haryanarural.gov.in","nodal":"ADC-cum-CEO, DRDA / DDPO","btype_raw":"Household","btype":"Household","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"SC/BC-A/BPL/AAY","cat":{"any":false,"tokens":["AAY","BC-A","BPL","SC"],"other":[],"note":""},"income_cap":null,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Partly verified (successor scheme)","verified":false,"gaps":[],"special":[]},{"id":"RD-018","parent":null,"sector":"Rural Development","dept":"Rural Development – DRDA (ADC-cum-CEO)","name":"Start-up Village Entrepreneurship Programme (SVEP) – Non-farm micro-enterprise promotion","name_hi":"स्टार्ट-अप ग्राम उद्यमिता कार्यक्रम","level":"Central","elig_text":"Target: SHGs, Aspiring rural micro-entrepreneurs in selected SVEP blocks of Haryana (women-led enterprises prioritized).project duration is 4 years\nEligibility: SHG members and their families; viable business idea vetted by Block Resource Centre; willingness to take CEF loan and/or bank credit and to be tracked for enterprise performance.","benefit":"Maximum project budget per block: ₹650.00 lakh; up to 2,400 enterprises can be supported in one block. Community Enterprise Fund (CEF) grant to community institutions to extend working-capital/Start-up loans to SVEP entrepreneurs; enterprise support services through Community Resource Persons-Enterprise Promotion (CRP-EP); at least 10% of enterprises should be linked to formal financial institutions for loans.","benefit_short":"Maximum project budget per block: ₹650.00 lakh; up to 2,400 enterprises can be supported in one block. Community Enterprise Fund (CEF) grant to community institutions to…","docs_text":"KYC (Aadhaar), bank account; SHG/CLF membership details; simple business plan appraised by BRC; local permits if applicable.","docs":["KYC (Aadhaar)","bank account","SHG/CLF membership details","simple business plan appraised by BRC","local permits if applicable"],"docs_canon":["aadhaar","bank","labour"],"how":"Approach Block SVEP BRC/HSRLM; CEF loan sanctioned by CLF/BRC; bank credit leveraged; handholding by CRP-EP; monitoring on SVEP portal.","mode":"Online","link_text":"https://haryanarural.gov.in (default dept portal – confirm)","link":"https://haryanarural.gov.in","nodal":"ADC-cum-CEO, DRDA / DDPO","btype_raw":"Enterprise","btype":"Enterprise","exclusions":"","age_min":null,"age_max":null,"gender":"F","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":null,"res_years":null,"occ_raw":"Enterprise/entrepreneur; SHG member","occ":["entrepreneur","shg"],"cls_raw":"Post-matric / higher education","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Referred to department – area/institutional scheme","verified":false,"gaps":[],"special":[]},{"id":"RD-019","parent":null,"sector":"Rural Development","dept":"Rural Development – DRDA (ADC-cum-CEO)","name":"Pradhan Mantri Awaas Yojana Gramin (PMAY-G)","name_hi":"प्रधानमंत्री आवास योजना – ग्रामीण","level":"State","elig_text":"Target: Eligible rural households as above; separate priority lists prepared for SC, ST and Others at GP/Village level. At least 60% of total targets at State level earmarked for SC/ST (subject to availability in PWL). States may ensure ~5% beneficiaries are persons with benchmark disabilities, prioritizing women with disabilities.\nEligibility: Rural households that are houseless or living in 0, 1 or 2-room kutcha houses as per SECC 2011/Awaas+ lists, subject to the SECC Exclusion Process (automatic exclusion filters) and Gram Sabha verification.\nAutomatic Inclusion categories receive top priority: households without shelter; destitute/living on alms; manual scavengers; Primitive Tribal Groups; legally released bonded labourers.","benefit":"Unit assistance: Rs.1.20 lakh (plains) and Rs.1.30 lakh (Hill States/UTs of J&K & Ladakh, NE, difficult areas, IAP districts). Minimum house size 25 sq.m incl. hygienic cooking space. Additional: 90/95 person-days of unskilled wage labour under MGNREGS; Rs.12,000 for toilet via SBM-G/MGNREGS/other funding. DBT to bank/post office account linked to Aadhaar (with consent). First instalment within 7 working days of sanction. Construction to be completed within 12 months.","benefit_short":"Unit assistance: Rs.1.20 lakh (plains) and Rs.1.30 lakh (Hill States/UTs of J&K & Ladakh, NE, difficult areas, IAP districts). Minimum house size 25 sq.m incl. hygienic…","docs_text":"Bank/Post Office account details (with IFSC); name of nominee; MGNREGS Job Card number; Mobile number (if available); Aadhaar number with beneficiary consent; Geo-tagged photos: current dwelling and proposed construction site via AwaasApp; In case of landless, government/allotted land details; Gram Sabha resolution confirming eligibility in PWL.","docs":["Bank/Post Office account details (with IFSC)","name of nominee","MGNREGS Job Card number","Mobile number (if available)","Aadhaar number with beneficiary consent","Geo-tagged photos: current dwelling and proposed construction site via AwaasApp","In case of landless, government/allotted land details","Gram Sabha resolution confirming eligibility in PWL"],"docs_canon":["aadhaar","bank","photo"],"how":"1) Identification from SECC 2011/Awaas+ lists -> system-generated category-wise priority list on AwaasSoft. 2) Gram Sabha verifies and may delete ineligible households; appeals heard by District Appellate Committee. 3) Final Permanent Wait List (PWL) published; Annual Select List drawn as per targets. 4) Beneficiary registration on AwaasSoft (bank/post account, Aadhaar with consent, job card etc.). 5) Sanction order issued (in the woman's name/jointly) with unique PMAY-G ID & QR; 6) First instalment DBT within 7 working days; subsequent instalments mapped to construction stages. 7) Beneficiary constructs house (no contractors); completion within 12 months; convergence for toilet, water, electricity, LPG.","mode":"Institutional / Convergence","link_text":"https://haryanarural.gov.in (default dept portal – confirm)","link":"https://haryanarural.gov.in","nodal":"ADC-cum-CEO, DRDA","btype_raw":"Household","btype":"Household","exclusions":"Eligibility: Rural households that are houseless or living in 0, 1 or 2-room kutcha houses as per SECC 2011/Awaas+ lists, subject to the SECC Exclusion Process","age_min":null,"age_max":null,"gender":"Any","cat_raw":"SC","cat":{"any":false,"tokens":["SC"],"other":[],"note":""},"income_cap":null,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"Post-matric / higher education","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Verified online 22-09-2026","verified":true,"gaps":[{"key":"gender","field":"Gender (col Z)","text":"States may ensure ~5% beneficiaries are persons with benchmark disabilities, prioritizing women with disabilities","report_only":true,"hint":"F"},{"key":"disability","field":"Disability % min (col AF)","text":"States may ensure ~5% beneficiaries are persons with benchmark disabilities, prioritizing women with disabilities"}],"special":[]},{"id":"ULB-004","parent":null,"sector":"Urban Development","dept":"Urban Local Bodies – SUDA (DAY-NULM / SVANidhi)","name":"Shelter for Urban Homeless (SUH) & Labour Sheds (under DAY-NULM)","name_hi":"शहरी बेघरों हेतु आश्रय एवं लेबर शेड","level":"CSS","elig_text":"Target: Urban homeless persons including inter-state migrants, elderly, women, persons with disabilities and families with children.\nEligibility: ULBs eligible to create/operate shelters Minimum capacity: plan for 100 shelter beds per 1 lakh urban population; each shelter preferably ≥50 persons. Space norm: 50 sq ft per person. Any urban homeless person. Open round-the-clock; admission/exit through registration, user charges, if any, must be nominal.","benefit":"Capital & O&M (first 5 years) shared 60:40 (GoI:State); Funds released 40%-40%-20% against progress. O&M include electricity & misc.,upkeep/replenishment, free food up to 10% inmates without means, and staff salaries. Each shelter has a Shelter Management Committee (ward member, ULB rep, caretakers, resident reps). O&M staffing: 1 full-time Manager + 3 caregivers (three 8-hour shifts) minimum.","benefit_short":"Capital & O&M (first 5 years) shared 60:40 (GoI:State); Funds released 40%-40%-20% against progress. O&M include electricity & misc.,upkeep/replenishment, free food up…","docs_text":"ULB DPR/concept plan, building/site availability, MoU with implementing agency (if PPP/NGO), AA/ES and tender/award documents; shelter registers and beneficiary records.","docs":["ULB DPR/concept plan, building/site availability, MoU with implementing agency (if PPP/NGO)","AA/ES and tender/award documents","shelter registers and beneficiary records"],"docs_canon":["ppp"],"how":"ULB identifies building/site → DPR as per SUH norms → approvals as per delegation → implementation through ULB/NGO partner → reporting on DAY-NULM MIS.","mode":"Institutional / Convergence","link_text":"https://ulbharyana.gov.in (default dept portal – confirm)","link":"https://ulbharyana.gov.in","nodal":"Commissioner MC / City Mission Manager (NULM)","btype_raw":"Individual","btype":"Individual","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":null,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"Post-matric / higher education","cls":[],"dis_min":null,"event_raw":"Admission","events":["admission"],"window_raw":"","window_days":null,"verif_raw":"Referred to department – area/institutional scheme","verified":false,"gaps":[{"key":"gender","field":"Gender (col Z)","text":"Target: Urban homeless persons including inter-state migrants, elderly, women, persons with disabilities and families with children","report_only":true,"hint":"F"},{"key":"disability","field":"Disability % min (col AF)","text":"Target: Urban homeless persons including inter-state migrants, elderly, women, persons with disabilities and families with children"},{"key":"special","field":"Special group (no column yet – suggest adding one)","text":"Scheme name indicates it is limited to: shelter. The app asks about this as a \"situation\" and hides the scheme unless it is ticked.","report_only":true}],"special":["shelter"]},{"id":"ULB-005","parent":null,"sector":"Urban Development","dept":"Urban Local Bodies Dept. (MC Karnal / MCs)","name":"Shifting of Milk Dairies out of Municipal Limits (State)- because illegal to keep/rear quadruped animals within Municipal limits as per Section 331A.","name_hi":"नगर सीमा से दुग्ध डेयरियों का स्थानांतरण","level":"State","elig_text":"Target: Registered urban dairy owners and city residents (indirect).\nEligibility: ULB area where in-situ dairies cause sanitation/public health risks; shifting per zoning/planning regulations; beneficiaries are dairy owners/operators registered with ULB; relocation to designated dairy zones. diaries--at least ≥ 200 m from residential dwellings and ≥ 500 m from hospitals & schools.","benefit":"No direct cash subsidy unless specifically notified by State; ULB provides serviced plots/sheds or common infrastructure in designated dairy zones; ULB can seal if diary owner denies to shift.","benefit_short":"No direct cash subsidy unless specifically notified by State; ULB provides serviced plots/sheds or common infrastructure in designated dairy zones; ULB can seal if diary…","docs_text":"Proof of dairy registration/licence, identity & address, compliance affidavits, allotment/lease papers for dairy zone where applicable.","docs":["Proof of dairy registration/licence, identity & address, compliance affidavits, allotment/lease papers for dairy zone where applicable"],"docs_canon":[],"how":"Apply to ULB for relocation/allotment as per notification; comply with timelines; ULB executes enabling works from State/ULB funds; enforcement through nuisance prevention/bye-laws.","mode":"Institutional / Convergence","link_text":"https://ulbharyana.gov.in (default dept portal – confirm)","link":"https://ulbharyana.gov.in","nodal":"Commissioner MC Karnal / EO (ULBs)","btype_raw":"Farmer","btype":"Farmer","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":null,"res_years":null,"occ_raw":"Livestock keeper","occ":["livestock"],"cls_raw":"School (pre-matric)","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Referred to department – area/institutional scheme","verified":false,"gaps":[],"special":[]},{"id":"ULB-008","parent":null,"sector":"Urban Development","dept":"Urban Local Bodies – SUDA (DAY-NULM / SVANidhi)","name":"Deendayal Antyodaya Yojana – National Urban Livelihoods Mission (DAY–NULM)","name_hi":"दीनदयाल अंत्योदय योजना – राष्ट्रीय शहरी आजीविका मिशन","level":"CSS","elig_text":"Target: Urban poor for self-employment (SEP), skills (EST&P), shelter (SUH), SHG formation (SM&ID).\nEligibility: Urban poor individuals/SHGs; ULB should have active City Mission Management Unit; bank linkage and Aadhaar/PPP required; age 18+ for credit-linked SEP.","benefit":"Self-Employment Programme (SEP): Interest subsidy of 7% p.a. on bank loan (Loan ceilings up to ₹2L (individual) and ₹10L (group) for individual/group enterprises; women SHGs eligible for additional 3% interest subvention. Revolving Fund: ₹10,000 per SHG; ₹50,000 per ALF (one-time). EST&P: skill training with placement-linked outcomes-₹15,000 per trainee to skill provider; no training fee to beneficiaries. SM&ID: revolving fund to SHGs/federations as per guidelines. SUH: capital support for permanent all-weather shelters, O&M and essential facilities; funding pattern 60:40 (GoI:State). Norms: 1 shelter per 1L population, ≥50 sq ft/person.","benefit_short":"Self-Employment Programme (SEP): Interest subsidy of 7% p.a. on bank loan (Loan ceilings up to ₹2L (individual) and ₹10L (group) for individual/group enterprises; women…","docs_text":"Aadhaar/PPP, income/poverty proof, bank account, loan application with DPR (SEP), SHG resolution, training enrollment forms.","docs":["Aadhaar/PPP, income/poverty proof, bank account, loan application with DPR (SEP)","SHG resolution, training enrollment forms"],"docs_canon":["ppp","aadhaar","bank","school"],"how":"Apply via ULB/CMMU; for SEP approach empanelled PLIs through ULB; for EST&P enroll with training partners; benefits released via DBT/subvention through banks.","mode":"Institutional / Convergence","link_text":"https://ulbharyana.gov.in (default dept portal – confirm)","link":"https://ulbharyana.gov.in","nodal":"Commissioner MC / City Mission Manager (NULM)","btype_raw":"Enterprise","btype":"Enterprise","exclusions":"","age_min":18.0,"age_max":null,"gender":"Any","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":null,"res_years":null,"occ_raw":"SHG member","occ":["shg"],"cls_raw":"","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Verified online 24-09-2026","verified":true,"gaps":[],"special":[]},{"id":"ULB-009","parent":null,"sector":"Urban Development","dept":"Urban Local Bodies – SUDA (DAY-NULM / SVANidhi)","name":"PM SVANidhi","name_hi":"पीएम स्वनिधि","level":"Central","elig_text":"Target: Urban street vendors – stationary, mobile/peripatetic and weekly-market vendors, plus service vendors (barbers, cobblers, laundry, repairs etc.); peri-urban/rural vendors vending in urban areas also eligible.\nEligibility: Street vendor holding a Certificate of Vending (CoV)/ID card issued by ULB; vendors identified in survey but without CoV get a Provisional CoV; left-out vendors on a Letter of Recommendation (LoR) from ULB/Town Vending Committee. Restructured scheme (Cabinet 27-08-2025): OPEN TO NEW VENDORS – the earlier 'vending on or before 24-03-2020' cut-off no longer restricts fresh entrants; lending window extended to 31-03-2030 (target 1.15 crore vendors incl. 50 lakh new); coverage extended to census towns and peri-urban areas in a graded manner.","benefit":"Collateral-free working-capital loans in three tranches: ₹15,000 → ₹25,000 → ₹50,000 (restructured Aug-2025; earlier ₹10k/20k/50k). 7% interest subsidy on timely repayment; cashback on digital transactions; UPI-linked RuPay credit card after 2nd loan. Open to new vendors till 31-03-2030.","benefit_short":"Collateral-free working-capital loans in three tranches: ₹15,000 → ₹25,000 → ₹50,000 (restructured Aug-2025; earlier ₹10k/20k/50k). 7% interest subsidy on timely…","docs_text":"Aadhaar/PPP, mobile number, bank account, CoV/LoR from ULB, vendor survey ID (if available).","docs":["Aadhaar/PPP, mobile number, bank account, CoV/LoR from ULB, vendor survey ID (if available)"],"docs_canon":["ppp","aadhaar","bank"],"how":"Apply on PM SVANidhi portal via CSC/ULB help desk; bank sanctions; ULB issues/validates CoV/LoR and conducts periodic verification; interest subsidy auto-credited on timely repayment.","mode":"Online","link_text":"https://ulbharyana.gov.in (default dept portal – confirm)","link":"https://ulbharyana.gov.in","nodal":"Commissioner MC / City Mission Manager (NULM)","btype_raw":"Worker","btype":"Worker","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":null,"res_years":null,"occ_raw":"Street vendor","occ":["vendor"],"cls_raw":"","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Verified online 22-09-2026","verified":true,"gaps":[],"special":[]},{"id":"HFA-001","parent":null,"sector":"Urban Development","dept":"Housing for All Dept. (HFA cell)","name":"Pradhan Mantri Awas Yojana – Urban 2.0 (PMAY-U 2.0) — 5-year Mission (01.09.2024–31.08.2029)- 4 verticals- BLC-; AHP; ARH and ISS.","name_hi":"प्रधानमंत्री आवास योजना – शहरी 2.0","level":"Central","elig_text":"Urban EWS/LIG/MIG families; no pucca house anywhere in India; one-time benefit under any PMAY-U 2.0 vertical. Income limits: EWS ≤ ₹3,00,000; LIG ≤ ₹6,00,000; MIG ≤ ₹9,00,000 per year. Family = husband, wife, unmarried sons/daughters. Not allotted a house under any Central/State/ULB housing scheme in last 20 years. BLC requires clear land title. Aadhaar seeding mandatory; selection by District/ULB Committee. Preference to Widows, single women, PwD, Senior Citizens, Transgenders,SCs, Minorities and other weaker sections.","benefit":"Four verticals (2024–29): (1) BLC – up to ₹2.5 lakh per unit to EWS families (income ≤ ₹3 lakh) to build a 30–45 sqm pucca house on own land; (2) AHP – ₹2.5 lakh per unit for EWS allotment in partnership projects; in Haryana the ₹2.5 lakh = ₹1.5 lakh Centre + minimum ₹1.0 lakh State; (3) ARH – rental housing for EWS/LIG migrants, workers, working women; (4) ISS – 4% interest subsidy on first ₹8 lakh of a home loan up to ₹25 lakh (house value ≤ ₹35 lakh), max ₹1.80 lakh, for EWS/LIG/MIG (income ≤ ₹3/6/9 lakh) on loans sanctioned from 01-09-2024. No pucca house anywhere in India; female (co-)ownership for EWS.","benefit_short":"Four verticals (2024–29): (1) BLC – up to ₹2.5 lakh per unit to EWS families (income ≤ ₹3 lakh) to build a 30–45 sqm pucca house on own land; (2) AHP – ₹2.5 lakh per…","docs_text":"Online: pmaymis.gov.in (Apply for PMAY-U 2.0) or via ULB/CSC facilitation; City-wise Housing Plans entered by ULB on Unified Web-Portal.","docs":["Online: pmaymis.gov.in (Apply for PMAY-U 2.0) or via ULB/CSC facilitation","City-wise Housing Plans entered by ULB on Unified Web-Portal"],"docs_canon":[],"how":"Centre→SNA; release to beneficiaries/ULBs within 15 days. BLC instalments: 40% (sanction) → 40% (Lintel Stage) → 20% (Completion) based on geo-tagging. BLC completion by beneficiary within 12 months of first instalment. affordable house- having carpet area up to 60 sqm in Metros and 90 sqm in non-metro value up to ₹45 L. AHP:-where at least 25% of the houses are\nless than 45 sqm for EWS category+ be completed within 24-36 month. Technology Innovation Grant to push faster, greener, disaster-resilient construction by offsetting the extra cost of innovative technologies/materials. CNA = MoHUA-designated agency that routes funds. PLI = borrower’s bank/HFC that sanctions the loan, files the claim, receives subsidy from CNA","mode":"Online","link_text":"pmaymis.gov.in","link":"https://pmaymis.gov.in","nodal":"Commissioner MC Karnal / EO (ULBs)","btype_raw":"Household","btype":"Household","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"EWS/Minority","cat":{"any":false,"tokens":["EWS","MINORITY"],"other":[],"note":""},"income_cap":900000.0,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"Post-matric / higher education","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Verified & updated 22-09-2026","verified":true,"gaps":[{"key":"gender","field":"Gender (col Z)","text":"Preference to Widows, single women, PwD, Senior Citizens, Transgenders,SCs, Minorities and other weaker sections","report_only":true,"hint":"F"}],"special":[]},{"id":"SEWA-015","parent":null,"sector":"Social Security","dept":"Social Justice & Empowerment (SEWA) – DSWO","name":"Deen Dayal Lado Lakshmi Yojana (DDLLY) – monthly income support to women","name_hi":"दीनदयाल लाडो लक्ष्मी योजना","level":"State","elig_text":"Target: Women aged 23–60 years of Haryana families with PPP-verified annual income ≤ ₹1,00,000 (Antyodaya), plus the two 2026 expansion categories below.\nEligibility: Woman (married or unmarried) aged 23–60; permanent resident of Haryana (or married to a man resident in Haryana ≥15 years); name in PPP/FIDR; family income ≤ ₹1,00,000 p.a. (no cap on number of eligible women per family). EXPANSION (Cabinet, Jan-2026): (a) mothers of Govt-school children scoring >80% in Class 10 or 12 board exams – eligible up to family income ₹1,80,000; (b) mothers who have rehabilitated a SAM/MAM child, as verified by WCD. Excluded: women already drawing OASA, Widow/Destitute, Divyang or Ladli allowance.","benefit":"₹2,100 per month via DBT (PFMS) into the woman's own bank account. Launched 25-09-2025 (Pt. Deendayal Upadhyaya Jayanti). 11th instalment released 11-09-2026 (~₹212 crore to >10 lakh women); cumulative >₹2,000 crore.","benefit_short":"₹2,100 per month via DBT (PFMS) into the woman's own bank account. Launched 25-09-2025 (Pt. Deendayal Upadhyaya Jayanti). 11th instalment released 11-09-2026 (~₹212…","docs_text":"PPP (Family ID); Aadhaar-linked mobile; Aadhaar; bank account in woman's own name (DBT-enabled); no physical documents – verification is against PPP data.","docs":["PPP (Family ID)","Aadhaar-linked mobile","Aadhaar","bank account in woman's own name (DBT-enabled)","no physical documents – verification is against PPP data"],"docs_canon":["ppp","aadhaar","bank"],"how":"Apply only through the 'Lado Lakshmi' mobile app (HARTRON) – no CSC/office visit needed: download app → register with Aadhaar-linked mobile → select family member → e-KYC/consent → submit. Verification against PPP/FIDR → payment from the following month. Helpline 1800-180-2231 / 0172-4880500. Status: pension.socialjusticehry.gov.in.","mode":"Online (mobile app)","link_text":"Lado Lakshmi App; pension.socialjusticehry.gov.in","link":"https://pension.socialjusticehry.gov.in","nodal":"District Social Welfare Officer (DSWO)","btype_raw":"Household","btype":"Household","exclusions":"Women drawing OASA, Widow/Destitute, Divyang or Ladli allowance (SEWA-exclusive)","age_min":23.0,"age_max":60.0,"gender":"F","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":100000.0,"res_years":15.0,"occ_raw":"","occ":[],"cls_raw":"Class 10","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Verified online 18-09-2026","verified":true,"gaps":[{"key":"category","field":"Category (col AA)","text":"Target: Women aged 23–60 years of Haryana families with PPP-verified annual income ≤ ₹1,00,000 (Antyodaya), plus the two 2026 expansion categories below","hint":["AAY"]},{"key":"disability","field":"Disability % min (col AF)","text":"Excluded: women already drawing OASA, Widow/Destitute, Divyang or Ladli allowance"},{"key":"school","field":"School type (no column yet – suggest adding \"Govt school only Y/N\")","text":"EXPANSION (Cabinet, Jan-2026): (a) mothers of Govt-school children scoring >80% in Class 10 or 12 board exams – eligible up to family income ₹1,80,000; (b) mothers who have rehabilitated a SAM/MAM child, as verified by WCD"}],"special":[]},{"id":"FCS-002","parent":null,"sector":"Food & Civil Supplies","dept":"Food, Civil Supplies & Consumer Affairs (DFSC)","name":"Har Ghar – Har Grihini Yojana (LPG cylinder at ₹500)","name_hi":"हर घर हर गृहिणी योजना (₹500 में एलपीजी सिलेंडर)","level":"State","elig_text":"Target: ≈50 lakh Antyodaya/BPL households of Haryana (women consumers).\nEligibility: Family registered in PPP with verified annual income ≤ ₹1,80,000 (Antyodaya/BPL families); must hold an active domestic LPG connection (IOCL/BPCL/HPCL) in the name of a family member; connection linked with Family ID.","benefit":"Domestic 14.2 kg LPG cylinder effectively at ₹500: consumer pays market price at delivery; State refunds the difference (over and above any Central Ujjwala subsidy) by DBT into the consumer's bank account; up to 12 cylinders per year; SMS intimation on each refund.","benefit_short":"Domestic 14.2 kg LPG cylinder effectively at ₹500: consumer pays market price at delivery; State refunds the difference (over and above any Central Ujjwala subsidy) by…","docs_text":"PPP (Family ID); Aadhaar; LPG consumer number/ID; bank account seeded with Aadhaar; registered mobile (OTP).","docs":["PPP (Family ID)","Aadhaar","LPG consumer number/ID","bank account seeded with Aadhaar","registered mobile (OTP)"],"docs_canon":["ppp","aadhaar","bank"],"how":"Register once on epds.haryanafood.gov.in → 'Har Ghar Har Grihini' → enter Family ID/Aadhaar → OTP → verify LPG connection details → submit. Refund is automatic on every refill thereafter. Registration was re-opened in 2026 for left-out families.","mode":"Online","link_text":"https://epds.haryanafood.gov.in","link":"https://epds.haryanafood.gov.in","nodal":"District Food & Supplies Controller (DFSC)","btype_raw":"Household","btype":"Household","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"BPL/AAY","cat":{"any":false,"tokens":["AAY","BPL"],"other":[],"note":""},"income_cap":180000.0,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Verified online 18-09-2026","verified":true,"gaps":[{"key":"gender","field":"Gender (col Z)","text":"Target: ≈50 lakh Antyodaya/BPL households of Haryana (women consumers)","report_only":true,"hint":"F"}],"special":[]},{"id":"HLTH-005","parent":null,"sector":"Health","dept":"Health Dept. (CMO)","name":"Ayushman Bharat PM-JAY + CHIRAYU Haryana (extension) + Ayushman Vay Vandana (70+)","name_hi":"आयुष्मान भारत पीएम-जय + चिरायु हरियाणा + आयुष्मान वय वंदना","level":"CSS + State","elig_text":"Target: Antyodaya families; middle-income families (contributory); all senior citizens 70+.\nEligibility: (a) PM-JAY: SECC-2011 deprived families; (b) CHIRAYU: all PPP-verified families with annual income ≤ ₹1,80,000 (free); (c) CHIRAYU-Extension: families with income ₹1.80–3 lakh on annual contribution of ₹1,500, and ₹3–6 lakh on annual contribution (₹4,000–5,000 – confirm current slab with Civil Surgeon); (d) Ayushman Vay Vandana: every citizen aged 70+ irrespective of income (Central, from Oct-2024).","benefit":"Cashless secondary & tertiary hospitalisation cover of ₹5 lakh per family per year at empanelled Govt & private hospitals (~1,900+ packages); 70+ members get a separate/top-up ₹5 lakh cover. No enrolment cost for income ≤ ₹1.8 lakh.","benefit_short":"Cashless secondary & tertiary hospitalisation cover of ₹5 lakh per family per year at empanelled Govt & private hospitals (~1,900+ packages); 70+ members get a…","docs_text":"PPP (Family ID) mandatory; Aadhaar; mobile; for contributory slabs – online payment receipt; for Vay Vandana – Aadhaar only (age from Aadhaar).","docs":["PPP (Family ID) mandatory","Aadhaar","mobile","for contributory slabs – online payment receipt","for Vay Vandana – Aadhaar only (age from Aadhaar)"],"docs_canon":["ppp","aadhaar"],"how":"Card generation on chirayuayushmanharyana.in / beneficiary.nha.gov.in or Ayushman App (self e-KYC); Antyodaya SARAL Kendras and CSCs assist; hospital Ayushman Mitra desk for admission.","mode":"Online / CSC","link_text":"https://chirayuayushmanharyana.in ; https://beneficiary.nha.gov.in","link":"https://chirayuayushmanharyana.in","nodal":"Civil Surgeon (Nodal Officer AB-PMJAY/CHIRAYU)","btype_raw":"Household","btype":"Household","exclusions":"Families above ₹1.80 lakh join on contribution (₹1,500 / ₹4,000 / ₹5,000 slabs)","age_min":70.0,"age_max":null,"gender":"Any","cat_raw":"BPL/AAY","cat":{"any":false,"tokens":["AAY","BPL"],"other":[],"note":""},"income_cap":180000.0,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"Post-matric / higher education","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Verified online 18-09-2026","verified":true,"gaps":[],"special":[]},{"id":"DC-002","parent":null,"sector":"Social Security","dept":"DC Office – Antyodaya / Planning cell","name":"Deen Dayal Upadhyaya Antyodaya Parivar Suraksha Yojana (DAYALU) – death/disability compensation","name_hi":"दीनदयाल उपाध्याय अंत्योदय परिवार सुरक्षा योजना (दयालु)","level":"State","elig_text":"Target: Antyodaya family members aged 6–60 years (death or permanent disability).\nEligibility: Member of a PPP-verified family with annual income ≤ ₹1,80,000; age 6 to 60 years at the time of death or permanent disability (≥70%); claim to be filed within 3 months of the event; not covered where compensation already received under PMJJBY/PMSBY for the same event (top-up logic as per notification).","benefit":"One-time assistance credited to family head/nominee: age 6–12: ₹1 lakh; 12–18: ₹2 lakh; 18–25: ₹3 lakh; 25–45: ₹5 lakh; 45–60: ₹3 lakh (death); disability as per slab. Launched 16-03-2023.","benefit_short":"One-time assistance credited to family head/nominee: age 6–12: ₹1 lakh; 12–18: ₹2 lakh; 18–25: ₹3 lakh; 25–45: ₹5 lakh; 45–60: ₹3 lakh (death); disability as per slab.…","docs_text":"PPP; Aadhaar; death certificate / permanent-disability certificate (Medical Board); bank passbook of nominee/family head; FIR & post-mortem if accidental.","docs":["Aadhaar","death certificate / permanent-disability certificate (Medical Board)","bank passbook of nominee/family head","FIR & post-mortem if accidental"],"docs_canon":["ppp","aadhaar","bank","disability","death"],"how":"Apply online on dapsy.finhry.gov.in (or via SARAL/CSC) within 3 months → verification by HPPA/DC office → DBT.","mode":"Online","link_text":"https://dapsy.finhry.gov.in","link":"https://dapsy.finhry.gov.in","nodal":"DC office (HPPA / Antyodaya Cell)","btype_raw":"Household","btype":"Household","exclusions":"","age_min":6.0,"age_max":60.0,"gender":"Any","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":180000.0,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"","cls":[],"dis_min":70.0,"event_raw":"Death; Accident","events":["death","accident"],"window_raw":"3 months","window_days":90,"verif_raw":"Verified online 18-09-2026","verified":true,"gaps":[{"key":"category","field":"Category (col AA)","text":"Target: Antyodaya family members aged 6–60 years (death or permanent disability)","hint":["AAY"]}],"special":[]},{"id":"HFA-002","parent":null,"sector":"Housing / Urban","dept":"Housing for All Dept. (HFA cell)","name":"Mukhyamantri Shehri Awas Yojana (MMSAY) – plots/flats for urban poor","name_hi":"मुख्यमंत्री शहरी आवास योजना","level":"State","elig_text":"Target: Urban Antyodaya families (≈2.9 lakh registered).\nEligibility: Urban families registered in PPP with verified annual income ≤ ₹1,80,000; no pucca house/plot anywhere in Haryana in the name of any family member; registered on HFA portal during the notified window.","benefit":"Allotment of 30 sq. yd residential plot (in notified towns) or a flat (in larger cities) at nominal/subsidised price, payable in instalments; plots being allotted town-wise since 2024-25 with registries done in special camps.","benefit_short":"Allotment of 30 sq. yd residential plot (in notified towns) or a flat (in larger cities) at nominal/subsidised price, payable in instalments; plots being allotted…","docs_text":"PPP; Aadhaar; bank details; self-declaration of 'no house'; registration acknowledgement on HFA portal.","docs":["Aadhaar","bank details","self-declaration of 'no house'","registration acknowledgement on HFA portal"],"docs_canon":["ppp","aadhaar","bank"],"how":"Registration on hfa.haryana.gov.in → draw of lots/eligibility check → allotment letter → payment of instalments → registry.","mode":"Online","link_text":"https://hfa.haryana.gov.in","link":"https://hfa.haryana.gov.in","nodal":"DMC / Executive Officer MC; DC (allotment committee)","btype_raw":"Household","btype":"Household","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"BPL/AAY","cat":{"any":false,"tokens":["AAY","BPL"],"other":[],"note":""},"income_cap":180000.0,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Verified online 24-09-2026","verified":true,"gaps":[],"special":[]},{"id":"RD-020","parent":null,"sector":"Housing / Rural","dept":"Rural Development – DRDA (ADC-cum-CEO)","name":"Mukhyamantri Gramin Awas Yojana (MMGAY) – 100 sq. yd plots (Phase-II of MGGBY)","name_hi":"मुख्यमंत्री ग्रामीण आवास योजना (100 वर्ग गज प्लॉट)","level":"State","elig_text":"Target: Rural landless Antyodaya families.\nEligibility: Rural families in PPP with verified annual income ≤ ₹1,80,000 (BPL/Antyodaya); no house/plot in the family; applied on HFA portal in the notified window; plot allotted from Panchayat land where available.","benefit":"Free 100 sq. yd residential plot (50 sq. yd in Mahagram villages) with basic amenities; where Panchayat land not available, financial assistance up to ₹1 lakh to purchase a plot (as under MGGBY).","benefit_short":"Free 100 sq. yd residential plot (50 sq. yd in Mahagram villages) with basic amenities; where Panchayat land not available, financial assistance up to ₹1 lakh to…","docs_text":"PPP; Aadhaar; 'no plot/house' affidavit; bank passbook; Gram Sabha resolution/beneficiary list.","docs":["Aadhaar","'no plot/house' affidavit","bank passbook","Gram Sabha resolution/beneficiary list"],"docs_canon":["ppp","aadhaar","bank"],"how":"Registration on hfa.haryana.gov.in (rural) → verification by BDPO/GP → allotment by DC → possession certificate.","mode":"Online","link_text":"https://hfa.haryana.gov.in","link":"https://hfa.haryana.gov.in","nodal":"DDPO / BDPO; ADC","btype_raw":"Household","btype":"Household","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"BPL/AAY","cat":{"any":false,"tokens":["AAY","BPL"],"other":[],"note":""},"income_cap":180000.0,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Partly verified (plot & eligibility; ₹1 lakh element unconfirmed)","verified":false,"gaps":[],"special":[]},{"id":"NRE-005","parent":null,"sector":"Energy","dept":"New & Renewable Energy – HAREDA (PO-NRE, ADC office)","name":"PM Surya Ghar Muft Bijli Yojana – rooftop solar with State top-up","name_hi":"पीएम सूर्य घर मुफ्त बिजली योजना","level":"Central + State","elig_text":"Target: Residential consumers; priority Antyodaya households.\nEligibility: Any domestic electricity consumer with own roof; for State top-up: PPP-verified family income ≤ ₹1,80,000 (and a lower top-up for ₹1.8–3 lakh) with monthly consumption within notified limit; vendor from DISCOM-empanelled list.","benefit":"Central subsidy: ₹30,000 for 1 kW, ₹60,000 for 2 kW, ₹78,000 for 3 kW and above; Haryana top-up for eligible poor families (announced ₹50,000 for ≤ ₹1.8 lakh income and ₹20,000 for ₹1.8–3 lakh – confirm current order); ~300 units free electricity equivalent; net-metering; collateral-free loan up to ₹2 lakh at ~7%. | Haryana top-up (secondary source, HAREDA to confirm): income ≤ ₹1.80 lakh – ₹25,000/kW or 40% (lower), up to 2 kW; ₹1.80–3 lakh – ₹10,000/kW or 20%, up to 2 kW.","benefit_short":"Central subsidy: ₹30,000 for 1 kW, ₹60,000 for 2 kW, ₹78,000 for 3 kW and above; Haryana top-up for eligible poor families (announced ₹50,000 for ≤ ₹1.8 lakh income and…","docs_text":"Electricity bill/consumer no.; Aadhaar; PPP; bank passbook; roof photo; vendor quotation.","docs":["Electricity bill/consumer no","Aadhaar","bank passbook","roof photo","vendor quotation"],"docs_canon":["ppp","aadhaar","bank","photo"],"how":"Register on pmsuryaghar.gov.in → DISCOM feasibility → install through empanelled vendor → net-meter → subsidy credited within ~30 days of commissioning.","mode":"Online","link_text":"https://pmsuryaghar.gov.in","link":"https://pmsuryaghar.gov.in","nodal":"XEN (Op.) UHBVN Karnal; Project Officer Renewable Energy (ADC office)","btype_raw":"Household","btype":"Household","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":180000.0,"res_years":null,"occ_raw":"","occ":[],"cls_raw":"","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Partly verified (secondary source)","verified":false,"gaps":[{"key":"category","field":"Category (col AA)","text":"Target: Residential consumers; priority Antyodaya households","hint":["AAY"]}],"special":[]},{"id":"DIC-030","parent":null,"sector":"Industry / MSME","dept":"Industries – DIC Karnal / KVIC","name":"PM Vishwakarma Yojana – artisans & craftspeople (18 trades)","name_hi":"पीएम विश्वकर्मा योजना","level":"Central","elig_text":"Target: Traditional artisans in the unorganised sector.\nEligibility: Artisan/craftsperson working with hands & tools in one of 18 notified family-based trades (carpenter, boat-maker, armourer, blacksmith, hammer/tool-kit maker, locksmith, goldsmith, potter, sculptor/stone-breaker, cobbler, mason, basket/mat/broom/coir weaver, doll & toy maker, barber, garland maker, washerman, tailor, fishing-net maker); age ≥18; not availed PMEGP/PM SVANidhi/MUDRA loan in last 5 years; one member per family; not a Govt employee family.","benefit":"Recognition (certificate + ID card); 5–7 day basic training with ₹500/day stipend; ₹15,000 toolkit e-voucher; collateral-free loan ₹1 lakh (18 months) and then ₹2 lakh (30 months) at 5% (Govt bears the rest up to 8%); ₹1 per digital transaction incentive (max 100/month); marketing support.","benefit_short":"Recognition (certificate + ID card); 5–7 day basic training with ₹500/day stipend; ₹15,000 toolkit e-voucher; collateral-free loan ₹1 lakh (18 months) and then ₹2 lakh…","docs_text":"Aadhaar; mobile; bank account; ration card/PPP; trade self-declaration (verified in 3 stages – Gram Panchayat/ULB → District → State).","docs":["Aadhaar","mobile","bank account","ration card/PPP","trade self-declaration (verified in 3 stages – Gram Panchayat/ULB → District → State)"],"docs_canon":["ppp","aadhaar","bank","ration"],"how":"Register at CSC (biometric) on pmvishwakarma.gov.in → Stage-1 verification by Sarpanch/ULB → Stage-2 District Implementa ana on completion of their engagement.\nEligibility: Ex-Agniveers applying for State recruitment or self-employment.","benefit":"• Horizontal reservation in direct recruitment: Police constable 20% (raised from 10% in 2025); mining guard, forest guard, jail warder, SPO 10%; Group C civil posts 5%; Group B 1%.\n• Age relaxation of 3 years (5 years for the first batch) in Group B/C/D recruitment.\n• Interest-free loan up to ₹5 lakh to start own business.\n• ₹60,000 per year subsidy to an industrial unit that employs an Agniveer at more than ₹30,000 per month.\n• Priority in arms licences; priority in HKRN matrix.","benefit_short":"Horizontal reservation in direct recruitment: Police constable 20% (raised from 10% in 2025); mining guard, forest guard, jail warder, SPO 10%; Group C civil posts 5%;…","docs_text":"Agniveer discharge / completion certificate, domicile, PPP","docs":["Agniveer discharge / completion certificate, domicile, PPP"],"docs_canon":["ppp","residence","medical"],"how":"Claim reservation/relaxation in HSSC/HPSC/Police recruitment forms; loan and industry-subsidy through the notified department.","mode":"Online","link_text":"HSSC / Haryana Police recruitment portals","link":"","nodal":"Secretary, Zila Sainik Board, Karnal (information) / recruiting agency","btype_raw":"Individual","btype":"Individual","exclusions":"","age_min":null,"age_max":null,"gender":"Any","cat_raw":"Any","cat":{"any":true,"tokens":[],"other":[],"note":""},"income_cap":null,"res_years":null,"occ_raw":"Ex-Agniveer","occ":["defence"],"cls_raw":"","cls":[],"dis_min":null,"event_raw":"","events":[],"window_raw":"","window_days":null,"verif_raw":"Partly verified (secondary source)","verified":false,"gaps":[],"special":[]},{"id":"REV-001","parent":null,"sector":"Agriculture","dept":"Revenue & Disaster Management (DRO / Tehsil)","name":"e-Kshatipurti – compensation for crop loss due to natural calamity (SDRF + State norms)","name_hi":"ई-क्षतिपूर्ति – प्राकृतिक आपदा से फसल नुकसान का मुआवज var st;
function reset(){ st = { screen:'start', ans:{}, draft:null, history:[], skipped:{}, err:'' }; }
reset();
var KEY = {types:'types',category:'cats',income:'income',occupation:'occ','class':'cls',disability:'dis',event:'events',residence:'res'};
var SINGLE = {income:1,'class':1,disability:1,residence:1};
var EXCLUSIVE = {GEN:1,UNK:1,none:1};

function asked(){ return st.history.filter(function(q){ return q !== 'types'; }); }
function forget(q){ if (q === 'about'){ delete st.ans.gender; delete st.ans.age; delete st.ans.about_done; } else delete st.ans[KEY[q]]; }
function draftFor(q){
  if (q === 'about') return { gender: st.ans.gender || null, age: st.ans.age != null ? String(st.ans.age) : '' };
  var v = st.ans[KEY[q]];
  if (q === 'types') return v ? v.slice() : ['Individual','Household'];
  return Array.isArray(v) ? v.slice() : (v || null);
}
function go(q){ st.screen = q; st.draft = draftFor(q); st.err = ''; render(); window.scrollTo(0,0); var h = document.getElementById('qh'); if (h) h.focus({preventScroll:true}); }
function commit(){
  var q = st.screen, d = st.draft;
  if (q === 'about'){
    if (!d.gender){ st.err = T(W.needAnswer); return render(); }
    var a = d.age.trim() === '' ? null : parseInt(d.age, 10);
    if (a != null && (isNaN(a) || a > 120)){ st.err = T({en:'Enter an age between 0 and 120, or leave it blank.',hi:'0 से 120 के बीच आयु लिखें, या खाली छोड़ें।'}); return render(); }
    st.ans.gender = d.gender; st.ans.age = a; st.ans.about_done = true;
  } else {
    if (d == null || (Array.isArray(d) && !d.length)){ st.err = T(W.needAnswer); return render(); }
    st.ans[KEY[q]] = d;
  }
  var i = st.history.indexOf(q);
  st.history.slice(i + 1).forEach(forget);   // later answers may no longer apply
  st.history = st.history.slice(0, i + 1);
  var n = E.nextQuestion(S, st.ans, asked());
  st.skipped = n.skipped;
  if (n.next){ st.history.push(n.next); go(n.next); }
  else { st.screen = 'results'; st.err = ''; render(); window.scrollTo(0,0); }
}
function back(){
  if (st.screen === 'results'){ go(st.history[st.history.length - 1]); return; }
  var i = st.history.indexOf(st.screen);
  if (i <= 0){ reset(); render(); return; }
  st.history = st.history.slice(0, i);
  go(st.history[i - 1]);
}
function previewAns(){
  var a = JSON.parse(JSON.stringify(st.ans)), q = st.screen, d = st.draft;
  if (q === 'about'){ if (d.gender) a.gender = d.gender; }
  else if (KEY[q] && d != null && !(Array.isArray(d) && !d.length)) a[KEY[q]] = d;
  return a;
}

function optBtn(o, pressed, single, sub){
  return '<button type="button" class="opt'+(single?' single':'')+'" data-v="'+esc(o.v)+'" aria-pressed="'+(pressed?'true':'false')+'">'+
    '<span class="box" aria-hidden="true"></span><span class="t">'+esc(T(o))+(sub?'<span class="s">'+esc(sub)+'</span>':'')+'</span></button>';
}
function progress(){
  var cur = st.history.indexOf(st.screen) + 1;
  var others = asked().filter(function(q){ return q !== st.screen; });
  var total = Math.max(cur, Math.min(E.MAX_SCREENS, 1 + others.length + E.remainingEstimate(S, st.ans, others)));
  var t = '';
  for (var i = 1; i <= total; i++) t += '<span class="'+(i < cur ? 'done' : i === cur ? 'now' : '')+'"></span>';
  return '<p class="qcount">'+fill(T(W.qof), {a:cur, b:total})+'</p><div class="ticks" aria-hidden="true">'+t+'</div>';
}

  document.documentElement.lang = lang;
